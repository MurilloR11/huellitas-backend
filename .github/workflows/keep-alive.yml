# Mantiene activa la demo pública de Huellitas.
#
# Supabase (plan gratuito) pausa el proyecto tras ~7 días sin actividad en la
# base de datos, y Render apaga el servidor gratuito tras unos minutos sin uso.
# Este workflow llama cada 3 días a un endpoint público que consulta la base de
# datos, así ambos servicios se mantienen activos.
name: Keep alive

on:
  schedule:
    - cron: "0 14 */3 * *"   # cada 3 días a las 14:00 UTC (9:00 a. m. en Colombia)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar GET /pets
        env:
          API_URL: https://huellitas-backend-7mxy.onrender.com
        run: |
          # Render puede tardar ~50 s en despertar: hasta 5 intentos con espera.
          for intento in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$API_URL/pets?per_page=1" || echo "000")
            echo "Intento $intento: HTTP $status"
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "La API y la base de datos respondieron correctamente."
              exit 0
            fi
            sleep 30
          done
          echo "::error::La API no respondió con éxito después de 5 intentos."
          exit 1
